4;color:#dce3eb}html[data-theme="dark"] .markdown-body .code-toolbar{background:#1b222c;border-color:#303844;color:#9ba8b7}html[data-theme="dark"] .markdown-body code{background:#252e3a}html[data-theme="dark"] .markdown-body pre code{background:transparent}html[data-theme="dark"] .markdown-body blockquote{background:#171e27;border-color:#596678;color:#aab6c4}html[data-theme="dark"] .markdown-body a{color:#58a6ff}html[data-theme="dark"] .markdown-body th{background:#1b222c}html[data-theme="dark"] .markdown-body th,html[data-theme="dark"] .markdown-body td,html[data-theme="dark"] .markdown-body hr{border-color:#303844}html[data-theme="dark"] .command-completions{background:#171e27;border-color:#3a4553}html[data-theme="dark"] .command-completion+ .command-completion{border-color:#303844}html[data-theme="dark"] .command-completion.selected{background:#20334d}html[data-theme="dark"] .token.comment,html[data-theme="dark"] .token.prolog,html[data-theme="dark"] .token.doctype,html[data-theme="dark"] .token.cdata{color:#8b949e}html[data-theme="dark"] .token.punctuation{color:#c9d1d9}html[data-theme="dark"] .token.property,html[data-theme="dark"] .token.tag,html[data-theme="dark"] .token.boolean,html[data-theme="dark"] .token.number,html[data-theme="dark"] .token.constant,html[data-theme="dark"] .token.symbol{color:#79c0ff}html[data-theme="dark"] .token.selector,html[data-theme="dark"] .token.attr-name,html[data-theme="dark"] .token.string,html[data-theme="dark"] .token.char,html[data-theme="dark"] .token.builtin{color:#a5d6ff}html[data-theme="dark"] .token.operator,html[data-theme="dark"] .token.entity,html[data-theme="dark"] .token.url,html[data-theme="dark"] .token.variable{color:#d2a8ff}html[data-theme="dark"] .token.atrule,html[data-theme="dark"] .token.attr-value,html[data-theme="dark"] .token.function,html[data-theme="dark"] .token.class-name{color:#d2a8ff}html[data-theme="dark"] .token.keyword{color:#ff7b72}

</head>
<body>
<div class="app">
  <div class="top">
    <strong>Pharo Coding Assistant</strong>
    <span id="status" class="status">connecting</span>
    <span class="control"><label>Agent <select id="agent"></select></label><button id="inspectAgent" class="inspect-link" title="Inspect current agent in Pharo">i</button></span>
    <span class="control"><label>Model <select id="model"></select></label><button id="inspectModel" class="inspect-link" title="Inspect current model in Pharo">i</button></span>
    <label class="reasoning-control">Reasoning <select id="reasoning"><option value="">provider default</option><option value="none">none</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="max">max</option></select></label>
    <label class="theme-control">Theme <select id="theme"><option value="auto">auto</option><option value="light">light</option><option value="dark">dark</option></select></label>
    <button id="newSession">New session</button>
    <span id="runState" class="muted"></span>
  </div>
  <div class="main">
    <aside class="sidebar">
      <h3>Sessions</h3><input id="sessionFilter" class="session-filter" type="search" placeholder="Filter sessions…" autocomplete="off"><div id="sessions"></div><button id="moreSessions" class="more-sessions hidden" type="button"></button>
      <h3>Tree</h3><div id="tree"></div>
      <button id="continueHere" class="hidden">Continue here</button>
    </aside>
    <section class="content">
      <div id="transcript" class="transcript"></div>
      <div class="runbar">
        <button id="cancel" disabled>Cancel</button>
        <button id="followUp" disabled>Follow-up</button>
        <span id="telemetryInfo" class="muted telemetry" title="Run telemetry">ctx — · in — · out — · — tok/s</span>
        <button id="inspectRun" class="inspect-link" title="Inspect current or most recent run in Pharo" disabled>i</button>
        <span id="eventInfo" class="muted"></span>
      </div>
    </section>
    <aside class="review">
      <h3>Run changes</h3>
      <div id="reviewSummary" class="muted">No reviewed run.</div>
      <div id="changes"></div>
      <button id="moreChanges" class="hidden">More changes</button>
      <h3>Change detail</h3>
      <div id="changeMeta" class="muted"></div>
      <pre id="changeDetail" class="diff">Select a change.</pre>
      <h3>Checkpoints</h3>
      <button id="createCheckpoint">Create checkpoint</button>
      <div id="checkpoints"></div>
      <button id="rollbackCheckpoint" class="hidden">Rollback planned checkpoint</button>
    </aside>
  </div>
  <div class="composer">
    <div class="composer-main">
      <textarea id="prompt" placeholder="Message the coding agent, or type / for commands. Ctrl+Enter to send."></textarea>
      <div id="commandCompletions" class="command-completions hidden"></div>
      <div class="attachmentbar"><input id="attachments" type="file" multiple><span id="attachmentInfo" class="muted">No attachments.</span></div>
    </div>
    <div class="buttons"><button id="send" class="primary">Send</button><button id="refresh">Refresh</button></div>
  </div>
</div>
<script src="/assets/prism-pca.js"></script>

</body>
</html>
